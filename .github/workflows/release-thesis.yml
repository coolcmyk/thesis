name: Release versioned thesis PDF

on:
  push:
    branches: [main]
    paths:
      - '**/*.tex'
      - '**/*.sty'
      - '**/*.bib'
      - 'assets/**'
      - 'Makefile'
      - '.github/workflows/release-thesis.yml'

permissions:
  contents: write

concurrency:
  group: thesis-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xu-cheng/texlive-full:latest

    steps:
      - name: Check out the edited thesis
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build thesis PDF
        run: make ENGINE=latexmk

      - name: Set release version
        id: version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          latest_tag="$(git tag -l 'thesis-v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"

          if [ -z "$latest_tag" ]; then
            version="v0.0.1"
          else
            numeric_version="${latest_tag#thesis-v}"
            major="${numeric_version%%.*}"
            remainder="${numeric_version#*.}"
            minor="${remainder%%.*}"
            patch="${remainder#*.}"
            version="v${major}.${minor}.$((patch + 1))"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=thesis-$version" >> "$GITHUB_OUTPUT"

      - name: Name the versioned PDF
        run: cp out/thesis.pdf "out/${{ steps.version.outputs.tag }}.pdf"

      - name: Create GitHub Release and attach PDF
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: thesis ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: out/${{ steps.version.outputs.tag }}.pdf
          fail_on_unmatched_files: true
