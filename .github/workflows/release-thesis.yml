name: Release versioned thesis PDF

on:
  push:
    branches: [main]
    paths:
      - '**/*.tex'
      - '**/*.sty'
      - '**/*.bib'
      - 'assets/**'
      - 'Makefile'
      - '.github/workflows/release-thesis.yml'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xu-cheng/texlive-full:latest

    steps:
      - name: Check out the edited thesis
        uses: actions/checkout@v4

      - name: Build thesis PDF
        run: make

      - name: Set release version
        id: version
        env:
          SHA: ${{ github.sha }}
        run: |
          echo "tag=thesis-$(printf '%.12s' "$SHA")" >> "$GITHUB_OUTPUT"

      - name: Name the versioned PDF
        run: cp out/thesis.pdf "out/${{ steps.version.outputs.tag }}.pdf"

      - name: Create GitHub Release and attach PDF
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Thesis ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: out/${{ steps.version.outputs.tag }}.pdf
          fail_on_unmatched_files: true
